# Musikpu = Bluetooth speaker mode of the home server YSL (192.168.178.20).
# YSL's old pipewire-media-session does not apply AVRCP absolute volume to the
# incoming stream (and echoes rounded values back -> volume creeps up), so the
# sender must scale the audio itself: no hardware volume for A2DP on this one
# device -> software volume on this machine. Harmless on hosts that never pair
# with Musikpu.
monitor.bluez.rules = [
  {
    matches = [ { device.name = "bluez_card.94_B8_6D_87_41_40" } ]
    actions = { update-props = { bluez5.hw-volume = [ hfp_ag hsp_ag ] } }
  }
]
