# Idle handling (started from hypr/quickshell.conf).
# hypridle provides org.freedesktop.ScreenSaver, so browsers playing video,
# Steam games and players can block the idle lock via D-Bus, and it also
# respects Wayland idle inhibitors (mpv, quickshell's presentation mode,
# the "idle_inhibit fullscreen" window rule).
general {
    lock_cmd = qs ipc call lock lock || hyprlock   # quickshell lock screen
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# lock after 15 minutes without input
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}
