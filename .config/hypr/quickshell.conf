# Keybinds for the quickshell desktop (~/.config/quickshell).
# Sourced at the end of hyprland.conf. Remove that `source` line to go back
# to the previous keybinds (rofi, swaync, hyprlock, ...).
#
# Every quickshell feature is reachable via IPC:  qs ipc show

# ---- OSD: brightness keys also tell quickshell to show the pop-up -----------
unbind = , XF86MonBrightnessDown
unbind = , XF86MonBrightnessUp
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%- && qs ipc call osd brightness
bind = , XF86MonBrightnessUp,   exec, brightnessctl set +10% && qs ipc call osd brightness

# ---- Ask pi: quick questions to the LLM (Ctrl+P inside switches the model) --
bind = SUPER, A, exec, qs ipc call pi toggle

# ---- bar panels ---------------------------------------------------------------
# "Update now" in the updates panel opens this terminal
windowrule = match:class floating-update, float on
windowrule = match:class floating-update, size 900 600

# ---- notifications (quickshell replaces dunst/swaync) ---------------------------
# dunst is masked:  systemctl --user unmask dunst   to go back
unbind = SUPER SHIFT, N
bind = SUPER SHIFT, N, exec, qs ipc call notifications toggleCenter
bind = SUPER CTRL SHIFT, N, exec, qs ipc call notifications toggleDnd

# ---- launcher / menus (replace rofi) ---------------------------------------------
unbind = SUPER, D
unbind = SUPER, P
bind = SUPER, D, exec, qs ipc call launcher toggle
bind = SUPER, V, exec, qs ipc call launcher open clip
bind = SUPER, period, exec, qs ipc call launcher open emoji
bind = SUPER, P, exec, qs ipc call power toggle
bind = SUPER CTRL, W, exec, qs ipc call wallpaper toggle
bind = SUPER CTRL, M, exec, qs ipc call monitors toggle
bind = SUPER CTRL, P, exec, qs ipc call presentation toggle

# ---- lock screen (quickshell, PAM config /etc/pam.d/hyprlock) -------------------
# Falls back to hyprlock if quickshell isn't running.
# If quickshell crashes while locked: Ctrl+Alt+F3, log in, run
#   hyprctl --instance 0 dispatch exec hyprlock
# then switch back (Ctrl+Alt+F1/F2) and unlock with hyprlock.
misc {
    allow_session_lock_restore = true
}
unbind = SUPER ALT CTRL, L
bind = SUPER ALT CTRL, L, exec, qs ipc call lock lock || hyprlock

# ---- screenshot tool (freeze, select area/window, copy/save/edit in satty) -------
unbind = SUPER, S
bind = SUPER, S, exec, qs ipc call screenshot region

# ---- workspace overview with live previews ---------------------------------------
bind = SUPER, Tab, exec, qs ipc call overview toggle

# ---- idle --------------------------------------------------------------------
# hypridle locks after 15 min (hypr/hypridle.conf) unless something inhibits
# idle: video in the browser, games (D-Bus) or any fullscreen window (rule below)
exec-once = hypridle
windowrule = match:class .*, idle_inhibit fullscreen

# ---- keyboard navigation of the bar (vi keys) ----------------------------------
# h/l modules · Enter open · j into the panel · hjkl inside · q quit
# jumps: n network, b bluetooth, a audio, p power, d dashboard, u updates, s system
bind = SUPER, B, exec, qs ipc call barnav toggle
