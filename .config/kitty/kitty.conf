enable_audio_bell no
# COLOR SCHEME (from the wallpaper via wallust, see ~/.config/wallust)
include colors-wallust.conf
dynamic_background_opacity  yes
background_opacity  0.5
font_family "NotoSansM Nerd Font Mono"

# Do not restore last window size/state (caused new windows to open maximized in Hyprland)
remember_window_size no
